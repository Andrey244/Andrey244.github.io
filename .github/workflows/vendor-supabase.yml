name: Vendor Supabase SDK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-supabase.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact npm package and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package supabase-supabase-js-*.tgz
          npm pack @supabase/supabase-js@2.117.1
          tar -xzf supabase-supabase-js-2.117.1.tgz
          test -f package/dist/umd/supabase.js
          ACTUAL="$(sha256sum package/dist/umd/supabase.js | awk '{print $1}')"
          EXPECTED="dff1e545f4f35bd42895cd6f46431e56137dd13031e46a9759c446447c11a567"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p vendor
          cp package/dist/umd/supabase.js vendor/supabase-2.117.1.js
      - name: Commit verified bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-2.117.1.js
          if git diff --cached --quiet; then
            echo "Bundle already vendored."
            exit 0
          fi
          git commit -m "Vendor verified Supabase JS 2.117.1"
          git push origin HEAD:main
