name: Windows Collector SCM Diagnostic

on:
  push:
    branches:
      - diagnostic/windows-service-scm-2026-09-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scm-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install machine-wide Python 3.12
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'python-3.12.10-amd64.exe'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet InstallAllUsers=1 TargetDir="C:\Python312-TJCI" PrependPath=0 Include_test=0 Include_launcher=0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Python installer exit code $($p.ExitCode)" }

      - name: Read public Supabase config
        shell: pwsh
        run: |
          $text = Get-Content '.\app.js' -Raw
          $url = [regex]::Match($text, "SUPABASE_URL='([^']+)'").Groups[1].Value
          $key = [regex]::Match($text, "SUPABASE_KEY='([^']+)'").Groups[1].Value
          "TJ_TEST_SUPABASE_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TJ_TEST_SUPABASE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install collector without auto-start
        shell: pwsh
        run: |
          & '.\collector\windows\install-service.ps1' `
            -SupabaseUrl $env:TJ_TEST_SUPABASE_URL `
            -PublishableKey $env:TJ_TEST_SUPABASE_KEY `
            -CollectorName 'GitHub-CI-SCM-Probe' `
            -NoStart

      - name: Switch to machine pywin32 service host
        shell: pwsh
        run: |
          $machineKey = Get-Item 'HKLM:\SOFTWARE\Python\PythonCore\3.12\InstallPath'
          $machinePython = [string]$machineKey.GetValue('ExecutablePath')
          if (-not (Test-Path $machinePython)) { throw "Machine Python missing: $machinePython" }

          & $machinePython -m pip install --disable-pip-version-check pywin32==312
          if ($LASTEXITCODE -ne 0) { throw 'Global pywin32 install failed.' }
          & $machinePython -m pywin32_postinstall -install
          if ($LASTEXITCODE -ne 0) { throw 'Global pywin32 postinstall failed.' }

          $machineRoot = Split-Path -Parent $machinePython
          $globalServiceExe = Join-Path $machineRoot 'pythonservice.exe'
          if (-not (Test-Path $globalServiceExe)) { throw "Global pythonservice.exe missing: $globalServiceExe" }

          $venvPython = 'C:\ProgramData\TradingJournalCollector\venv\Scripts\python.exe'
          $sitePackages = (& $venvPython -c "import sysconfig; print(sysconfig.get_paths()['purelib'])").Trim()
          $pythonClass = $sitePackages + '\trading_journal_collector.service.TradingJournalCollectorService'

          sc.exe config TradingJournalCollector binPath= ('"' + $globalServiceExe + '"') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to switch service host.' }
          reg.exe add 'HKLM\SYSTEM\CurrentControlSet\Services\TradingJournalCollector\PythonClass' /ve /t REG_SZ /d $pythonClass /f | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set path-qualified PythonClass.' }

          Write-Host ('Global service host: ' + $globalServiceExe)
          Write-Host ('PythonClass: ' + $pythonClass)

      - name: Start collector and inspect runtime
        shell: pwsh
        run: |
          sc.exe qc TradingJournalCollector
          reg.exe query 'HKLM\SYSTEM\CurrentControlSet\Services\TradingJournalCollector\PythonClass' /ve
          sc.exe start TradingJournalCollector | Out-Host
          Start-Sleep -Seconds 15
          Get-Service TradingJournalCollector | Format-List Name,Status,StartType
          $registration = 'C:\ProgramData\TradingJournalCollector\state\registration.json'
          Write-Host ('registration exists=' + (Test-Path $registration))
          if (-not ((Get-Service TradingJournalCollector).Status -eq 'Running' -and (Test-Path $registration))) {
            Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'TradingJournalCollector|Trading Journal Collector' } |
              Select-Object TimeCreated,Id,Message |
              Format-List
            $appEvents = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Python|Application Error|Windows Error Reporting|SideBySide' -or $_.Message -match 'pythonservice|TradingJournalCollector|python312|pywintypes|pythoncom' }
            $appEvents |
              Select-Object TimeCreated,Id,ProviderName,Message |
              Format-List

            Write-Host '=== PYTHON SERVICE RAW EVENT DATA ==='
            foreach ($evt in ($appEvents | Where-Object ProviderName -eq 'Python Service')) {
              Write-Host ('Event ID=' + $evt.Id + ' Time=' + $evt.TimeCreated)
              Write-Host 'Properties:'
              $index = 0
              foreach ($prop in $evt.Properties) {
                Write-Host ("  [" + $index + "] " + [string]$prop.Value)
                $index++
              }
              Write-Host 'XML:'
              Write-Host ($evt.ToXml())
            }
            throw 'Windows SCM runtime proof failed.'
          }
