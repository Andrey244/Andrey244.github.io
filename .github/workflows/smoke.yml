name: Trading Journal smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -e ./collector
      - name: Run collector contract regression
        run: node scripts/collector-regression.mjs
      - name: Run collector Python unit tests
        env:
          PYTHONPATH: collector/src
        run: |
          python -m compileall -q collector/src
          python -m unittest discover -s collector/tests -v
      - name: Run end-to-end smoke checks
        run: node scripts/smoke.mjs


  collector-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows collector dependencies
        run: python -m pip install --disable-pip-version-check -e "./collector[windows]"
      - name: Verify pinned MetaTrader5 package
        run: |
          python -c "import importlib.metadata as m; assert m.version('MetaTrader5') == '5.0.6180'; import MetaTrader5"
      - name: Verify pinned pywin32 service runtime
        run: |
          python -c "import importlib.metadata as m; assert m.version('pywin32') == '312'; import win32serviceutil; import trading_journal_collector.service"
      - name: Parse Windows installer scripts
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'collector/windows/install-service.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){ throw ($errors | Out-String) }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'collector/windows/uninstall-service.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){ throw ($errors | Out-String) }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'collector/windows/preflight.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){ throw ($errors | Out-String) }
      - name: Run Windows DPAPI integration test
        env:
          PYTHONPATH: collector/src
        run: python -m unittest discover -s collector/tests -p "test_windows_runtime.py" -v

      - name: Ensure machine-wide Python registration for SCM
        shell: pwsh
        run: |
          $keyPath = 'HKLM:\SOFTWARE\Python\PythonCore\3.12\InstallPath'
          if (-not (Test-Path $keyPath)) {
            $installer = Join-Path $env:RUNNER_TEMP 'python-3.12.10-amd64.exe'
            Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' -OutFile $installer
            $p = Start-Process -FilePath $installer -ArgumentList '/quiet InstallAllUsers=1 TargetDir="C:\Python312-TJCI" PrependPath=0 Include_test=0 Include_launcher=0' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Python installer exit code $($p.ExitCode)" }
          }
          $key = Get-Item $keyPath
          Write-Host ('Machine Python: ' + $key.GetValue('ExecutablePath'))

      - name: Run real Windows SCM collector acceptance
        shell: pwsh
        run: |
          $app = Get-Content '.\app.js' -Raw
          $url = [regex]::Match($app, "SUPABASE_URL='([^']+)'").Groups[1].Value
          $key = [regex]::Match($app, "SUPABASE_KEY='([^']+)'").Groups[1].Value
          if (-not $url -or -not $key) { throw 'Public Supabase config not found in app.js' }

          & '.\collector\windows\install-service.ps1' `
            -SupabaseUrl $url `
            -PublishableKey $key `
            -CollectorName 'GitHub-CI-SCM-Acceptance'

          $svc = Get-Service TradingJournalCollector
          if ($svc.Status -ne 'Running') {
            throw "Collector service is not Running: $($svc.Status)"
          }
          $registration = 'C:\ProgramData\TradingJournalCollector\state\registration.json'
          if (-not (Test-Path $registration)) {
            throw 'Collector registration.json was not created under real SCM startup.'
          }
          Write-Host 'Real Windows SCM collector acceptance passed.'

      - name: Cleanup Windows SCM collector acceptance
        if: always()
        shell: pwsh
        run: |
          Stop-Service TradingJournalCollector -Force -ErrorAction SilentlyContinue
          sc.exe delete TradingJournalCollector 2>$null | Out-Null
          Start-Sleep -Seconds 2
