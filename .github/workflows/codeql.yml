name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql-config.yml
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: always
      - name: Fail closed on unexpected CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No CodeQL SARIF output was produced."
            exit 1
          fi

          jq -s '[.[].runs[]?.results[]?]' "${files[@]}" > all-codeql-results.json
          total="$(jq 'length' all-codeql-results.json)"
          echo "CodeQL raw findings: $total"

          jq --slurpfile allow .github/codeql-accepted-findings.json '
            [ .[] as $r
              | ($r.locations[0].physicalLocation.artifactLocation.uri // "") as $path
              | select(
                  ([ $allow[0].accepted[]
                     | select(.ruleId == ($r.ruleId // "") and .path == $path)
                   ] | length) == 0
                )
            ]' all-codeql-results.json > unexpected-codeql-results.json

          accepted="$(( total - $(jq 'length' unexpected-codeql-results.json) ))"
          unexpected="$(jq 'length' unexpected-codeql-results.json)"
          echo "CodeQL reviewed accepted findings: $accepted"
          echo "CodeQL unexpected findings: $unexpected"

          if [ "$accepted" -gt 0 ]; then
            echo "Reviewed accepted findings:"
            jq -r --slurpfile allow .github/codeql-accepted-findings.json '
              .[] as $r
              | ($r.locations[0].physicalLocation.artifactLocation.uri // "") as $path
              | $allow[0].accepted[]
              | select(.ruleId == ($r.ruleId // "") and .path == $path)
              | [.ruleId, .path, .rationale] | @tsv
            ' all-codeql-results.json
          fi

          if [ "$unexpected" -gt 0 ]; then
            jq -r '.[] | [(.ruleId // "unknown"), (.message.text // ""), ((.locations[0].physicalLocation.artifactLocation.uri // "?") + ":" + ((.locations[0].physicalLocation.region.startLine // 0)|tostring))] | @tsv' unexpected-codeql-results.json
            exit 1
          fi
