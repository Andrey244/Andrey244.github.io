name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          category: "/language:${{ matrix.language }}"
