[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-journal-collector"
version = "0.1.0"
description = "Read-only MT4/MT5 collector foundation for Trading Journal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.1",
]

[project.optional-dependencies]
mt5 = [
  "MetaTrader5==5.0.6180; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]


[project.scripts]
trading-journal-collector = "trading_journal_collector.main:main"
trading-journal-collector-provision = "trading_journal_collector.provision:main"
